plugins {
    id 'com.android.application'
}

android {
    namespace "com.privacy.calculator"
    compileSdk 34

    defaultConfig {
        applicationId "com.privacy.calculator"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// 无依赖 - 使用原生 Android API
dependencies {
    // 无第三方库
}
