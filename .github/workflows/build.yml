name: Build Privacy Calculator APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools-version: '34.0.0'
    
    - name: Make gradlew executable
      run: chmod +x gradlew
    
    - name: Download Gradle Wrapper JAR
      run: |
        mkdir -p gradle/wrapper
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.0.0/gradle/wrapper/gradle-wrapper.jar || echo "Download failed, trying alternative..."
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          echo "Using gradle-build-action instead"
        fi
    
    - name: Build with Gradle
      uses: gradle/gradle-build-action@v3
      with:
        arguments: assembleDebug
        gradle-version: '8.0'
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: PrivacyCalculator-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
